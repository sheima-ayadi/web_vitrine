<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Admin - Infini-Soft</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 2.5rem;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      text-align: center;
    }
    .logo { margin-bottom: 2rem; }
    h2 { font-family: 'Syne', sans-serif; margin-bottom: 2rem; }
    .form-group { text-align: left; margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text2); }
    input {
      width: 100%;
      padding: 0.8rem 1rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    .btn-primary { width: 100%; justify-content: center; margin-top: 1rem; }
    #error-msg { color: #ff4d4d; font-size: 0.85rem; margin-top: 1rem; display: none; }
    .setup-link { margin-top: 2rem; font-size: 0.8rem; color: var(--text2); }
    .setup-link span { color: var(--accent); cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <img src="img/logo-light.svg" alt="Infini-Soft" style="height: 40px;">
    </div>
    <h2>Connexion Admin</h2>
    <form id="loginForm">
      <div class="form-group">
        <label>Utilisateur</label>
        <input type="text" id="username" required placeholder="admin">
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" id="password" required placeholder="••••••">
      </div>
      <button type="submit" class="btn-primary">Se connecter</button>
      <p id="error-msg"></p>
    </form>
    
    <div class="setup-link">
      Première connexion ? <br>
      <span onclick="setupAdmin()">Initialiser le compte Admin</span>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin === 'null' || window.location.protocol === 'file:' 
      ? 'http://localhost:5000/api' 
      : '/api';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');

      try {
        const res = await fetch(`${API_URL}/Auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('adminToken', data.token);
          window.location.href = 'admin.html';
        } else {
          errorMsg.textContent = data.error || 'Identifiants incorrects';
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = 'Erreur de connexion au serveur';
        errorMsg.style.display = 'block';
      }
    });

    async function setupAdmin() {
      if (!confirm("Voulez-vous initialiser le compte administrateur par défaut ?")) return;
      try {
        const res = await fetch(`${API_URL}/Auth/setup`, { method: 'POST' });
        const data = await res.json();
        alert(data.message || data.error);
      } catch (err) {
        alert("Erreur lors de l'initialisation");
      }
    }
  </script>
</body>
</html>
